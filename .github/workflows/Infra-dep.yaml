# Workflow Name
name: "Infrastructure Provisioning"

# Workflow Triggers
on:
  workflow_dispatch: # Enables manual trigger for the workflow

# Environment Variables
env:
  S3_BUCKET: ${{ vars.S3_BUCKET_NAME }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  EKS_CLUSTER: ${{ vars.EKS_CLUSTER }}
  ARGOCD_ADMIN_PASSWORD: ${{ secrets.ARGOCD_ADMIN_PASSWORD }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}


permissions:
  id-token: write
  contents: read

# Define Jobs
jobs: 
  provision-infra:
    name: "Deploy Infrastructure with Terraform"
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ./terraform

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install htpasswd and generate ArgoCD admin password hash
        run: |
          # apache2-utils is required for htpasswd to generate a bcrypt hash for the ArgoCD admin password.
          sudo apt-get update && sudo apt-get install -y apache2-utils
          PASSWORD_HASH=$(htpasswd -nbB admin "$ARGOCD_ADMIN_PASSWORD" | cut -d: -f2)
          echo "TF_VAR_argocd_admin_password_hash=$PASSWORD_HASH" >> $GITHUB_ENV
        working-directory: . # Run in the root directory

      - name: Terraform Init for Infra
        run: terraform init

      - name: Run Trivy vulnerability scanner in IaC mode
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: 'config'
          scan-ref: './terraform'
          format: 'sarif'
          output: 'trivy-iac-results.sarif'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-iac-results.sarif'

      - name: Terraform Validate for Infra
        run: terraform validate

      - name: Terraform Plan for Infra
        run: terraform plan -no-color -out=planfile

      - name: Terraform Apply for Infra
        id: infra_apply
        run: terraform apply -auto-approve -input=false planfile

      - name: Get Kubernetes config
        if: steps.infra_apply.outcome == 'success'
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}
        working-directory: . # Run in the root directory

      - name: Verify cluster connectivity
        if: steps.infra_apply.outcome == 'success'
        run: kubectl get nodes -o wide
        working-directory: . # Run in the root directory