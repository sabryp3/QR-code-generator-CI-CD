name: Building QR generator images

on: 
  workflow_dispatch:

jobs:
  buildapi:
    runs-on: ubuntu-latest
    env:
      S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    permissions:
      contents: read          # Required to checkout and read repo files
      security-events: write  # Required to upload SARIF files to Security tab

    steps:
      - uses: actions/checkout@v4
      
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          args: >
            -Dsonar.projectKey=sabryp3_QR-code-generator-CI-CD
            -Dsonar.sources=.
            -Dsonar.organization=sabryp3-key
            -Dsonar.host.url=https://sonarcloud.io
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.x'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: 'api/requirements.txt'
      
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Install dependencies
        run: |
              python -m pip install --upgrade pip
              pip install --no-cache-dir -r api/requirements.txt

      - name: Test with pytest
        run: pytest api/test_main.py

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set tag
        id: tag
        run: echo "TAG=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          push: false
          load: true
          tags: |
            sabryp3/qrgenerator-api:latest
            sabryp3/qrgenerator-api:${{steps.tag.outputs.TAG}}
          file: api/Dockerfile

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'sabryp3/qrgenerator-api:latest'
          format: 'sarif'
          exit-code: '1'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          output: 'trivy-api-results.sarif'
      
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-api-results.sarif'

      - name: Push image
        run: |
          docker push sabryp3/qrgenerator-api:latest
          docker push sabryp3/qrgenerator-api:${{steps.tag.outputs.TAG}}

  buildnode:
    runs-on: ubuntu-latest
    env:
      S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    
    permissions:
      contents: read          # Required to checkout and read repo files
      security-events: write  # Required to upload SARIF files to Security tab

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          architecture: 'x64'
          cache: 'npm'
          cache-dependency-path: 'front-end-nextjs/package-lock.json'

      - run: npm ci
        working-directory: front-end-nextjs

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Set tag
        id: tag
        run: echo "TAG=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          push: false
          load: true
          tags: |
            sabryp3/qrgenerator-nodejs:latest
            sabryp3/qrgenerator-nodejs:${{steps.tag.outputs.TAG}}
          file: front-end-nextjs/Dockerfile
          context: front-end-nextjs

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'sabryp3/qrgenerator-nodejs:latest'
          format: 'sarif'
          exit-code: '1'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          output: 'trivy-node-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-node-results.sarif'

      - name: Push image
        run: |
          docker push sabryp3/qrgenerator-nodejs:latest
          docker push sabryp3/qrgenerator-nodejs:${{steps.tag.outputs.TAG}}
